name: release-main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          last_tag="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
          if [[ -z "$last_tag" ]]; then
            next_tag="v0.1.0"
          else
            ver="${last_tag#v}"
            IFS='.' read -r major minor patch <<< "$ver"
            if [[ -z "${major:-}" || -z "${minor:-}" || -z "${patch:-}" ]]; then
              echo "Latest tag '$last_tag' is not semver (vMAJOR.MINOR.PATCH)."
              exit 1
            fi
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"
          echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Build Linux binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ steps.version.outputs.next_tag }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/llmfs-linux-amd64 ./cmd/llmfs

      - name: Package release tarball
        run: |
          set -euo pipefail
          pkg_dir="dist/llmfs-linux-amd64"
          mkdir -p "${pkg_dir}"
          cp dist/llmfs-linux-amd64 "${pkg_dir}/llmfs"
          cp README.md "${pkg_dir}/README.md"
          mkdir -p "${pkg_dir}/examples"
          cp -R examples/. "${pkg_dir}/examples/"
          tar -C dist -czf dist/llmfs-linux-amd64.tar.gz llmfs-linux-amd64
          shasum -a 256 dist/llmfs-linux-amd64.tar.gz > dist/llmfs-linux-amd64.tar.gz.sha256

      - name: Create tag
        run: |
          git tag "${{ steps.version.outputs.next_tag }}"
          git push origin "${{ steps.version.outputs.next_tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next_tag }}
          generate_release_notes: true
          files: |
            dist/llmfs-linux-amd64.tar.gz
            dist/llmfs-linux-amd64.tar.gz.sha256
