name: build-linux

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Build Linux binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/llmfs ./cmd/llmfs

      - name: Package release tarball
        run: |
          set -euo pipefail
          pkg_dir="dist/llmfs-linux-amd64"
          mkdir -p "${pkg_dir}"
          cp dist/llmfs "${pkg_dir}/llmfs"
          cp README.md "${pkg_dir}/README.md"
          mkdir -p "${pkg_dir}/examples"
          cp -R examples/. "${pkg_dir}/examples/"
          tar -C dist -czf dist/llmfs-linux-amd64.tar.gz llmfs-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llmfs-linux-amd64-tarball
          path: dist/llmfs-linux-amd64.tar.gz
